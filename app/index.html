<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121816" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tackboard">
  <meta name="description" content="Tableros Kanban, calendario y tareas compartidas. Autoalojado y sin conexión.">
  <title>Tackboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegación"></aside>
    <main class="main" id="main" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Tackboard necesita JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
