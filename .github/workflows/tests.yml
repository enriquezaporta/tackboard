name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas del servidor
        run: python3 -m unittest discover -s tests -v
      - name: Sintaxis de los scripts
        run: |
          bash -n deploy/install.sh
          bash -n deploy/tackboard-admin
          sh -n docker/entrypoint.sh
      - name: Sintaxis de la app
        run: for f in $(find app -name '*.js'); do node --check --input-type=module < "$f" || exit 1; done
